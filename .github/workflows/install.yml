name: Install / Deploy NovaInstall

on:
  workflow_dispatch:
    inputs:
      cloudflare_api_token:
        description: "Cloudflare API Token (Workers + D1 Edit permissions)"
        required: true
        type: string
      worker_name:
        description: "Worker name (optional — leave empty for random)"
        required: false
        type: string
        default: ""
      account_id:
        description: "Cloudflare Account ID (optional — auto-detected if empty)"
        required: false
        type: string
        default: ""

jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Generate random names & secrets
        id: gen
        run: |
          # Random worker name if not provided
          if [ -z "${{ inputs.worker_name }}" ]; then
            RAND=$(openssl rand -hex 3)
            WORKER_NAME="nova-${RAND}"
          else
            WORKER_NAME="${{ inputs.worker_name }}"
          fi
          echo "worker_name=${WORKER_NAME}" >> $GITHUB_OUTPUT

          # Strong random admin password
          ADMIN_PASS=$(openssl rand -base64 18 | tr -d '/+=' | head -c 18)
          echo "admin_password=${ADMIN_PASS}" >> $GITHUB_OUTPUT

          # Session secret
          SESSION_SECRET=$(openssl rand -hex 32)
          echo "session_secret=${SESSION_SECRET}" >> $GITHUB_OUTPUT

          # DB name
          echo "db_name=${WORKER_NAME}-db" >> $GITHUB_OUTPUT

      - name: Configure Cloudflare credentials
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ inputs.cloudflare_api_token }}" >> $GITHUB_ENV
          if [ -n "${{ inputs.account_id }}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=${{ inputs.account_id }}" >> $GITHUB_ENV
          fi

      - name: Detect Account ID (if missing)
        id: account
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            ACC=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts" \
              -H "Authorization: Bearer ${{ inputs.cloudflare_api_token }}" \
              -H "Content-Type: application/json" | jq -r '.result[0].id')
            if [ -z "$ACC" ] || [ "$ACC" = "null" ]; then
              echo "❌ Could not detect Account ID. Please provide it manually."
              exit 1
            fi
            echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> $GITHUB_ENV
            echo "account_id=$ACC" >> $GITHUB_OUTPUT
            echo "✅ Detected Account ID: $ACC"
          else
            echo "account_id=$CLOUDFLARE_ACCOUNT_ID" >> $GITHUB_OUTPUT
            echo "✅ Using provided Account ID"
          fi

      - name: Create D1 Database
        id: d1
        run: |
          DB_NAME="${{ steps.gen.outputs.db_name }}"
          echo "Creating D1 database: $DB_NAME"

          # Try create (ignore if already exists)
          OUTPUT=$(npx wrangler d1 create "$DB_NAME" 2>&1 || true)
          echo "$OUTPUT"

          # Extract database_id
          DB_ID=$(echo "$OUTPUT" | grep -oP 'database_id\s*=\s*"\K[^"]+' || true)

          if [ -z "$DB_ID" ]; then
            # Maybe already exists — list and find
            LIST=$(npx wrangler d1 list --json 2>/dev/null || echo "[]")
            DB_ID=$(echo "$LIST" | jq -r --arg name "$DB_NAME" '.[] | select(.name==$name) | .uuid' | head -1)
          fi

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "❌ Failed to create or find D1 database"
            exit 1
          fi

          echo "database_id=$DB_ID" >> $GITHUB_OUTPUT
          echo "✅ D1 database_id = $DB_ID"

      - name: Update wrangler.toml
        run: |
          WORKER_NAME="${{ steps.gen.outputs.worker_name }}"
          DB_NAME="${{ steps.gen.outputs.db_name }}"
          DB_ID="${{ steps.d1.outputs.database_id }}"

          cat > wrangler.toml << EOF
          name = "${WORKER_NAME}"
          main = "src/index.ts"
          compatibility_date = "2024-11-01"
          compatibility_flags = ["nodejs_compat"]

          [[d1_databases]]
          binding = "DB"
          database_name = "${DB_NAME}"
          database_id = "${DB_ID}"

          [assets]
          directory = "public"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          run_worker_first = ["/api/*"]

          [vars]
          ENVIRONMENT = "production"
          APP_NAME = "NovaInstall"
          APP_VERSION = "1.0.0"
          EOF

          echo "✅ wrangler.toml updated"
          cat wrangler.toml

      - name: Run D1 Migrations
        run: |
          npx wrangler d1 execute "${{ steps.gen.outputs.db_name }}" --remote --file=./migrations/0001_init.sql
          echo "✅ Migrations applied"

      - name: Deploy Worker
        run: |
          npx wrangler deploy
          echo "✅ Worker deployed"

      - name: Set Secrets
        run: |
          echo "${{ steps.gen.outputs.session_secret }}" | npx wrangler secret put SESSION_SECRET
          echo "${{ steps.gen.outputs.admin_password }}" | npx wrangler secret put INITIAL_ADMIN_PASSWORD
          echo "✅ Secrets set"

      - name: Final Summary
        run: |
          WORKER_NAME="${{ steps.gen.outputs.worker_name }}"
          ADMIN_PASS="${{ steps.gen.outputs.admin_password }}"

          echo ""
          echo "=============================================="
          echo "🎉 NovaInstall deployed successfully!"
          echo "=============================================="
          echo ""
          echo "🔗 Panel URL (try these):"
          echo "   https://${WORKER_NAME}.workers.dev"
          echo "   (or check Cloudflare Dashboard → Workers for exact URL)"
          echo ""
          echo "👤 Username : admin"
          echo "🔑 Password : ${ADMIN_PASS}"
          echo ""
          echo "⚠️  Save this password now. It will not be shown again."
          echo "   After first login you will be asked to change it."
          echo "=============================================="

          # Also write to job summary
          {
            echo "## 🎉 NovaInstall Installed"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| **Worker** | \`${WORKER_NAME}\` |"
            echo "| **URL** | https://${WORKER_NAME}.workers.dev |"
            echo "| **Username** | \`admin\` |"
            echo "| **Password** | \`${ADMIN_PASS}\` |"
            echo ""
            echo "> ⚠️ Save the password now. Change it after first login."
          } >> $GITHUB_STEP_SUMMARY
